name: Publish Docker Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hister

jobs:
  build:
    name: Build Docker release images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta-release
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          bake-target: release
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Extract root metadata
        id: meta-root
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          bake-target: root
          flavor: |
            latest=false
            suffix=-root,onlatest=true
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Extract debug metadata
        id: meta-debug
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          bake-target: debug
          flavor: |
            latest=false
            suffix=-debug,onlatest=true
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Build and push release Docker images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta-release.outputs.bake-file }}
            cwd://${{ steps.meta-root.outputs.bake-file }}
            cwd://${{ steps.meta-debug.outputs.bake-file }}
          targets: images
          push: true
          set: |
            *.platform=linux/amd64
            *.platform+=linux/arm64
            *.attest=type=provenance,mode=max
            *.attest+=type=sbom
            *.no-cache=true
